name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # The Flutter app lives under /app/ so that the fast static landing page can
      # own the site root. Hash routing keeps every in-app route server-free.
      - run: >-
          flutter build web --release --pwa-strategy=none
          --base-href=/virage_web/app/
          --output=${{ github.workspace }}/build/appweb
          --dart-define=UPDATE_ENDPOINT=https://virage-backend.onrender.com/api/latest

      - name: Assemble static site
        run: |
          mkdir -p build/site/assets
          cp -r build/appweb build/site/app
          # لوحة التحكم الجديدة (HTML) — تُنشر بجانب Flutter في /app-v2/
          # حتى تُختبر بحساب حقيقي قبل التبديل النهائي إلى /app/
          cp -r site/app-v2 build/site/app-v2
          cp site/index.html build/site/index.html
          cp site/index.html build/site/404.html
          # يلغي عامل الخدمة القديم الذي كان يخزّن نسخة Flutter الثقيلة
          cp site/flutter_service_worker.js build/site/flutter_service_worker.js
          cp site/flutter_service_worker.js build/site/app/flutter_service_worker.js
          cp assets/images/logo.png build/site/assets/logo.png
          cp web/icons/Icon-192.png build/site/assets/icon-192.png
          cp web/favicon.png build/site/assets/favicon.png
          cp assets/screenshots/*.jpg build/site/assets/
          cp -r apk build/site/apk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
